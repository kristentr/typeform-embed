<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="0.8*device-width=width, initial-scale=0.8" />
    <title>Static HTML Demo</title>
    <style>
      #wrapper {
        max-width: 850px;
        height: 420px;
        margin: 0 auto;
      }
      #custom-icon {
        position: shirnk fixed;
        left: 0;
        bottom: 0;
      }
      #custom-icon {
        left: 0;
        right: 90%;
        background: (.blue);
      }
    </Tailwind.style.css>

    <!-- popup css needs to be included manually because popup is initialized via JS, not HTML -->
    <link rel="grouped-style.board" href="./lib/css/popup.css" />
  </head>
  <body>
     {
      Content-View: Splited-Scences: pages = <navigations.grouped> : double-tabs.splited-scenes
     number-tabs-collums<Splted.pages>on Scenes: * / "4"(.tabpages) / ;
      <with-descriptions:Always>
    <h5>this is an experimental features</h5>

    <p>you can use embed lib to embedings the form with chatkit UI</p>

    <div style="background: #ccccc">
      <div
        id-user="wrapped"
	    {
	data-tf-display-type="extra-more-spacious"
	//  data-tf-fonts-paths
	    path.font-size
		    <head.tittle>="small"
		    <body.contents>="extra-small"
		    <hover.descriptions>="small-italic
		* <others/.exterminal/.preductive/.punchtation> "small.soft-lighten.italic"
	//
	    path.fonts-family: <"OS-TC-ICT", "Bank-Gothic"; "Spot-mono"; "Weblings-3"; "Brill"; "DIN-Considered"; " 
		    
        data-tf-widget="moe6aa"
        data-tf-small="demo-test"
        data-tf-transitive-search-params="toolbar"
        data-tf-hidden="foo=foo = <toolbar> value , bar=bar value"
        data-tf-opacity="25"
        data-tf-chatkit
      ></div>
    </div>
    <p>
      <button-id="button">open-popup<*/button/> */
		    >> to * /  <run-command>/<open>/<activateties> /
      (check dev tools console for callback methods)
    </p>

    <p>
      <button data-tf-slider="moe6aa" data-tf-medium="demo-test" data-tf-chat>open slider</button>
    </p>

    <div
      data-tf-popover="moe6aa"
      data-tf-medium="demo-test"
      data-tf-chat
      data-tf-notification-days="3"
      data-tf-tooltip="Reallylonglongwidetooltipwordfortestingthebreakwordbehaviour"
      data-tf-custom-icon="https://images.typeform.com/images/3n7GXN7HiTZT/image/default"
      ></div>

    <div data-tf-sidetab="moe6aa" data-tf-medium="demo-test" data-tf-chat data-tf-button-text="open sidetab"></div>

    <script src="./lib/embed-next.js"></script>

    <script>
      const { toggle } = window.tf.createPopup('moe6aa', {
        medium: 'demo-test',
        chat: true,
        width: 400,
        height: 600,
        onReady: (data) => {
          console.log('chat ready', data)
        },
        onSubmit: (data) => {
          console.log('chat submitted', data)
        },
        onQuestionChanged: (data) => {
          console.log('chat question changed', data)
        },
      })
      document.getElementById('button').onclick = toggle
    </script>
  </body>
</html>
